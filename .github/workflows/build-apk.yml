name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Download & install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          echo "WORKDIR: $(pwd)"
          echo "Contents: $(ls)"
          ls app/
          /tmp/gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Debug files
        run: |
          echo "=== BUILD OUTPUTS ==="
          find app/build -type f 2>/dev/null | head -30 || echo "NO FILES FOUND"
          echo "=== APK FILES ==="
          find . -name "*.apk" 2>/dev/null | head -10 || echo "NO APK"

      - name: Upload whole build dir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: app/build/
