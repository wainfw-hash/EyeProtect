name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 生成 Gradle Wrapper
        run: |
          # 下载标准 gradlew 脚本和 wrapper jar
          cd gradle/wrapper
          curl -sLO "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          cd ../..
          curl -sLO "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew"
          chmod +x gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: EyeProtect-App
          path: app/build/outputs/apk/debug/app-debug.apk
