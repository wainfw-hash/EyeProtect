name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Download & install Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.5-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          echo "::notice title=PWD::$(pwd)"
          test -f settings.gradle.kts && echo "::notice title=settings.gradle.kts::OK" || echo "::error title=settings.gradle.kts::MISSING"
          /tmp/gradle-8.5/bin/gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; EXIT_CODE=${PIPESTATUS[0]}
          echo "::notice title=Gradle exit code::$EXIT_CODE"
          ls app/build/outputs/apk/debug/ 2>/dev/null || echo "::warning title=No APK output::path not found"
          find . -name "*.apk" 2>/dev/null | head -5 | while read f; do echo "::notice title=APK::$f"; done
          exit $EXIT_CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EyeProtect-App
          path: app/build/outputs/
